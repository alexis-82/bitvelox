[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitvelox"
version = "0.3.1"
description = "Self-hosted Subsonic-compatible MP3 streaming server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alessio" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "mutagen>=1.47",
    "pillow>=11.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.17",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
bitvelox = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
