{% extends "base.html" %}
{% block title %}Login — BitVelox{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="card">
    <h2 style="margin-top:0">BitVelox</h2>
    <p class="subtle" style="margin-top:0">Sign in to manage your library.</p>
    <form method="post" action="/login">
      <div class="form-row">
        <label for="u">Username</label>
        <input id="u" type="text" name="username" autofocus required>
      </div>
      <div class="form-row">
        <label for="p">Password</label>
        <input id="p" type="password" name="password" required>
      </div>
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
